user root;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # HTTP Server - Redirect all HTTP traffic to HTTPS
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # HTTPS Server
    server {
	listen 443 ssl;
	http2 on;

	ssl_certificate /etc/certs/active.crt;
	ssl_certificate_key /etc/certs/active.key;

	# Standard Forwarded Headers
	proxy_set_header Host $host;
	proxy_set_header X-Real-IP $remote_addr;
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header X-Forwarded-Proto https;
	proxy_set_header X-Forwarded-Scheme https;
	proxy_set_header X-Forwarded-Host $host;
	proxy_set_header X-Forwarded-Port 443;

	# Override restrictive CSP to allow localhost self-connections
	proxy_hide_header Content-Security-Policy;
	add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval' https: http: ws: wss: data: blob:;" always;

	# 1. Route interactive Login UI components (Next.js)
	location /ui/v2/login {
	    proxy_pass http://zitadel-login:3000;

	    proxy_http_version 1.1;
	    proxy_set_header Upgrade $http_upgrade;
	    proxy_set_header Connection "upgrade";

	    proxy_set_header Host $host;
	    proxy_set_header X-Real-IP $remote_addr;
	    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	    proxy_set_header X-Forwarded-Proto https;
	    proxy_set_header X-Forwarded-Host $host;
	    proxy_set_header X-Forwarded-Port 443;
	}

	# 2. Route explicit native gRPC calls (SDKs / Services)
	location /zitadel. {
	    grpc_pass grpc://zitadel-api:8160;
	    grpc_set_header Host $host;
	    grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	    grpc_set_header X-Forwarded-Proto https;
	    grpc_set_header X-Forwarded-Port 443;
	}

	# 3. Route REST API, OIDC Endpoints, and Console (gRPC-Web)
	location / {
	    proxy_pass http://zitadel-api:8160;
	    proxy_http_version 1.1;
	    proxy_set_header Upgrade $http_upgrade;
	    proxy_set_header Connection "upgrade";

	    proxy_set_header Host $host;
	    proxy_set_header X-Real-IP $remote_addr;
	    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	    proxy_set_header X-Forwarded-Proto https;
	    proxy_set_header X-Forwarded-Host $host;
	    proxy_set_header X-Forwarded-Port 443;

	    # CORS & gRPC-Web Preflight Handling
	    if ($request_method = 'OPTIONS') {
		add_header Access-Control-Allow-Origin "https://$host" always;
		add_header Access-Control-Allow-Credentials "true" always;
		add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
		add_header Access-Control-Allow-Headers "Accept, Authorization, Content-Type, Origin, x-user-agent, x-grpc-web, x-accept-content-transfer-encoding, x-accept-response-streaming, x-zitadel-loginclient" always;
		add_header Access-Control-Max-Age 1728000;
		add_header Content-Type 'text/plain; charset=utf-8';
		add_header Content-Length 0;
		return 204;
	    }

	    add_header Access-Control-Allow-Origin "https://$host" always;
	    add_header Access-Control-Allow-Credentials "true" always;
	}
    }
}
