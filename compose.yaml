services:

  # FASTAPI
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "${BACKEND_PORT}:8000"
    volumes:
      - ./backend/app/:/app
      - ./backend/alembic/:/app/alembic
      - ./backend/alembic.ini:/app/alembic.ini
    command: sh -c 'fastapi dev main.py --host 0.0.0.0 --port 8000'
    env_file:
      - path: ./.env
